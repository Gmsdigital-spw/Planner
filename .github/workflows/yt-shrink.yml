name: YouTube Starship shrink

# Shrinks each video queued in yt/queue/ to under 5 MB so the YouTube Starship
# can upload it through Make's free plan. Only touches the yt/ folder.
on:
  push:
    paths:
      - "yt/queue/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency: yt-shrink

jobs:
  shrink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg jq
      - name: Shrink queued videos under 4.8 MB
        run: |
          mkdir -p yt/out
          shopt -s nullglob
          for f in yt/queue/*.json; do
            name=$(basename "$f" .json)
            [ -f "yt/out/$name.mp4" ] && continue
            url=$(jq -r .url "$f")
            curl -fsSL "$url" -o in.mp4
            dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 in.mp4)
            kbps=$(python3 -c "d=float('$dur'); print(max(400, int(4.5*8192/d - 96)))")
            ffmpeg -y -i in.mp4 -vf "scale=720:-2" -c:v libx264 -preset slow -b:v ${kbps}k -pass 1 -an -f mp4 /dev/null
            ffmpeg -y -i in.mp4 -vf "scale=720:-2" -c:v libx264 -preset slow -b:v ${kbps}k -pass 2 -c:a aac -b:a 96k -movflags +faststart "yt/out/$name.mp4"
            ls -l "yt/out/$name.mp4"
            rm -f in.mp4 ffmpeg2pass*
          done
      - name: Save the small videos
        run: |
          git config user.name "YouTube Starship"
          git config user.email "actions@users.noreply.github.com"
          git add yt/out
          git diff --cached --quiet || (git commit -m "Shrink queued Shorts" && git push)
