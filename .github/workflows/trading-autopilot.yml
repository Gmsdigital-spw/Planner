name: Trading autopilot

# Grayson's Trading Floor, ALL DAY (V7, Oct 21 2026).
# One runner stays up for ~5.5 hours and checks the market every minute (factory/trading/autopilot.py --loop).
# When its time is up it hands off to a fresh runner, so the bot is on the floor from the opening bell to the close.
# Three ways it wakes up, so it never depends on GitHub's (unreliable, ~40 min late) cron alone:
#   1. the hand-off dispatch from the previous runner
#   2. a kick file pushed by the hourly Trading scans (factory/trading/kick/<day>-<HHMM>.txt)
#   3. the cron below, every 10 minutes as a safety net (queues behind a running loop, never doubles up)
# Own concurrency group: a waiting gateway job (starship-gw) is never cancelled by this workflow and vice versa.
# Pause: set "paused": true in factory/trading/auto/control.json, or disable this workflow.
# Same strategy the Trading lab tests; every order goes through the gateway's hard rules ($20 floor, stop on every buy...).
on:
  schedule:
    - cron: "*/10 13-21 * * 1-5"
  push:
    paths:
      - "factory/trading/kick/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: trading-autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q requests cryptography
      - name: Trade all day (one cycle a minute, up to 330 minutes, then hand off)
        id: loop
        env:
          STARSHIP_KEY: ${{ secrets.STARSHIP_KEY }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_LIVE: ${{ vars.ALPACA_LIVE }}
          ALPACA_FLOOR: ${{ vars.ALPACA_FLOOR }}
          ALPACA_BANKROLL: ${{ vars.ALPACA_BANKROLL }}
        run: python factory/trading/autopilot.py --loop 330
      - name: Save state (the loop pushes as it goes; this catches anything left)
        if: always()
        run: |
          git config user.name "trading-autopilot"
          git config user.email "trading-autopilot@users.noreply.github.com"
          git add factory/trading/auto gw/state
          git diff --cached --quiet && exit 0
          git commit -qm "trading autopilot: $(TZ=America/Chicago date +%H:%M) CT"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; git rebase --abort || true; sleep $((i*5)); done
          exit 1
      - name: Hand off to a fresh runner while the market is still open
        if: always() && steps.loop.outputs.status != 'paused' && steps.loop.outputs.status != 'closed' && steps.loop.outputs.status != 'done'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=$(TZ=America/Chicago date +%u); T=$(TZ=America/Chicago date +%H%M)
          if [ "$D" -le 5 ] && [ "$T" -ge 0800 ] && [ "$T" -lt 1500 ]; then
            gh workflow run trading-autopilot.yml --ref main && echo "handed off" || echo "dispatch failed; the 10-minute cron picks it up"
          else
            echo "market closed for the day; no hand-off"
          fi
