name: Trading autopilot

# Grayson's Trading Floor, all day: every 5 minutes on weekdays during market hours
# (cron covers both CDT and CST; the script checks the market clock itself).
# Same strategy the Trading lab tests; every order goes through the gateway's hard rules.
# Pause: set "paused": true in factory/trading/auto/control.json, or disable this workflow.
on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starship-gw
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q requests cryptography
      - name: Trade
        env:
          STARSHIP_KEY: ${{ secrets.STARSHIP_KEY }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_LIVE: ${{ vars.ALPACA_LIVE }}
          ALPACA_FLOOR: ${{ vars.ALPACA_FLOOR }}
          ALPACA_BANKROLL: ${{ vars.ALPACA_BANKROLL }}
        run: python factory/trading/autopilot.py
      - name: Save state
        run: |
          git config user.name "trading-autopilot"
          git config user.email "trading-autopilot@users.noreply.github.com"
          git add factory/trading/auto gw/state
          git diff --cached --quiet && exit 0
          git commit -qm "trading autopilot: $(TZ=America/Chicago date +%H:%M) CT"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
