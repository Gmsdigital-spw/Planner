name: YouTube Starship build

# Builds every job spec in yt/jobs/ into a finished Short in yt/out/ — free.
# Voice: Kokoro (edge-tts fallback). Word timings: faster-whisper. Footage: the
# clip URLs in the spec, or a Pexels search when the PEXELS_API_KEY secret exists.
# Only touches the yt/ folder.
on:
  push:
    paths:
      - "yt/jobs/**"
  workflow_dispatch:
    inputs:
      job:
        description: "Job id to (re)build, e.g. ep11 (blank = every job without an output)"
        required: false

permissions:
  contents: write

concurrency:
  group: yt-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg + espeak
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng fonts-dejavu-core jq

      - name: Cache models and packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: yt-build-models-v1

      - name: Install voice + timing tools
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q "kokoro>=0.9.4" soundfile faster-whisper edge-tts transformers opencv-python-headless pillow gradio_client

      - name: Build the Shorts
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_ANIM_SPACES: ${{ vars.HF_ANIM_SPACES }}
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          shopt -s nullglob
          only="${{ github.event.inputs.job }}"
          for f in yt/jobs/*.json; do
            name=$(basename "$f" .json)
            if [ -n "$only" ]; then
              [ "$name" = "$only" ] || continue
              rm -f "yt/out/$name.mp4" "yt/out/$name.json"
            fi
            [ -f "yt/out/$name.mp4" ] && continue
            echo "=== checking $name ==="
            if ! timeout 480 python yt/build/make_short.py "$f" --check > /tmp/check.log 2>&1; then
              tail -20 /tmp/check.log
              rm -f "yt/out/$name.mp4"
              msg=$(tail -1 /tmp/check.log | tr -d '"\\' | cut -c1-200)
              echo "{\"id\":\"$name\",\"error\":\"job failed the dry run: $msg\"}" > "yt/out/$name.json"
              continue
            fi
            echo "=== building $name ==="
            if ! timeout 1500 python yt/build/make_short.py "$f" > /tmp/build1.log 2>&1; then
              tail -15 /tmp/build1.log
              echo "=== retry $name with the backup voice ==="
              rm -f "yt/out/$name.mp4" "yt/out/$name.json"
              jq '.engine="kokoro"' "$f" > /tmp/retry.json && cp /tmp/retry.json "/tmp/$name.json"
              mkdir -p /tmp/yt/jobs && cp "/tmp/$name.json" "/tmp/yt/jobs/$name.json"
              if timeout 600 python yt/build/make_short.py "/tmp/yt/jobs/$name.json" > /tmp/build2.log 2>&1; then
                cp "/tmp/yt/out/$name.mp4" "/tmp/yt/out/$name.json" yt/out/
              else
                tail -15 /tmp/build2.log
                why=$(grep -v '^\$ ' /tmp/build2.log | tail -3 | tr -d '"\\' | tr '\n' ' ' | cut -c1-400)
                echo "{\"id\":\"$name\",\"error\":\"build failed twice: $why\"}" > "yt/out/$name.json"
              fi
            fi
          done

      - name: Save the finished videos
        run: |
          git config user.name "YouTube Starship"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/save && cp -r yt/out/. /tmp/save/
          for i in 1 2 3 4; do
            git fetch -q --depth=1 origin main && git reset -q --hard origin/main
            mkdir -p yt/out && cp -r /tmp/save/. yt/out/
            git add yt/out
            git diff --cached --quiet && { echo "nothing new"; break; }
            git commit -q -m "Build Shorts" && git push origin HEAD:main && { echo "saved"; break; }
            echo "push failed, retry $i"; sleep $((i*5))
          done
