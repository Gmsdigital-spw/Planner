name: Engine tests

# Add-on Phase 3: runs the engine's unit tests (all integrations mocked) plus the V7 rules self-test
# on every push that touches them. Green check = safe; red = the Mechanic reads the log in the morning.
on:
  push:
    paths:
      - "factory/engine/**"
      - "factory/learning/**"
      - "factory/notebook/nb.py"
      - "factory/shared/runlog.py"
      - "factory/gm_factory_v7.py"
      - ".github/workflows/engine-tests.yml"
  pull_request:
    paths:
      - "factory/engine/**"
      - "factory/learning/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Engine unit tests (mocked integrations)
        run: python -m unittest discover -s factory/engine/tests -t . -v
      - name: V7 rules self-test
        run: python factory/gm_factory_v7.py --selftest
      - name: Learning: legacy vs candidate on the saved real inspections (same frozen rubric; nothing may be raised)
        run: |
          python -m factory.learning ingest --only runnotes,scores > /dev/null
          python -m factory.learning compare --split train
          python -m factory.learning compare --split holdout
      - name: Contracts export is up to date
        run: |
          python -m factory.engine export-ts
          git diff --exit-code -- factory/engine/ts/contracts.d.ts factory/engine/contracts.schema.json
      - name: Engine status (journal replay)
        run: python -m factory.engine status
