<!doctype html>
<html lang="en" data-biz="atlas">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Atlas Hub, V8 "The Turning Point" (Oct 24, 2026). One look for both businesses: cream, white cards,
   one brand colour (navy here, green for Ridgeline Local), Today first. Real numbers only; unknown is "—". */
:root{
  color-scheme:light;
  --bg:#F6F4EF; --card:#FFFFFF; --raised:#F6F4EF; --sunk:#EFECE5; --ink:#111511; --muted:#5E655F; --dim:#858C86; --line:#ECE9E2; --line2:#DCD8CE;
  --ok:#2E8F3C; --ok-dot:#3BAA4A; --ok-soft:rgba(59,170,74,.13);
  --warn:#9A6B00; --warn-dot:#E3A21A; --warn-soft:rgba(227,162,26,.16);
  --bad:#C6412F; --bad-dot:#D94B3D; --bad-soft:rgba(217,75,61,.12);
  --brand:#12305A; --brand-2:#1F4A82; --brand-ink:#FFFFFF; --pill:#E6EEF8; --pill-ink:#12305A;
  --radius:22px; --r:14px; --shadow:0 6px 24px rgba(20,30,20,.07);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E110F; --card:#171B18; --raised:#1E241F; --sunk:#0A0D0B; --ink:#F2F4F1; --muted:#9AA39C; --dim:#6F786F; --line:#232925; --line2:#30382F;
  --ok:#4FD18B; --ok-dot:#4FD18B; --ok-soft:rgba(79,209,139,.14);
  --warn:#FFB020; --warn-dot:#FFB020; --warn-soft:rgba(255,176,32,.16);
  --bad:#FF6B6B; --bad-dot:#FF6B6B; --bad-soft:rgba(255,107,107,.16);
  --brand:#7FB0F0; --brand-2:#A6C8F6; --brand-ink:#061427; --pill:#1A2638; --pill-ink:#BFD3F2;
  --shadow:0 18px 50px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E110F; --card:#171B18; --raised:#1E241F; --sunk:#0A0D0B; --ink:#F2F4F1; --muted:#9AA39C; --dim:#6F786F; --line:#232925; --line2:#30382F;
  --ok:#4FD18B; --ok-dot:#4FD18B; --ok-soft:rgba(79,209,139,.14);
  --warn:#FFB020; --warn-dot:#FFB020; --warn-soft:rgba(255,176,32,.16);
  --bad:#FF6B6B; --bad-dot:#FF6B6B; --bad-soft:rgba(255,107,107,.16);
  --brand:#7FB0F0; --brand-2:#A6C8F6; --brand-ink:#061427; --pill:#1A2638; --pill-ink:#BFD3F2;
  --shadow:0 18px 50px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3,h4,p,ul{margin:0}
h1,h2,h3,h4{font-weight:800;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:where(a,button,summary,input,select,textarea,[tabindex]):focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-variant-numeric:tabular-nums}
.app{min-height:100%;display:grid;grid-template-rows:auto 1fr}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));max-width:640px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:20px;letter-spacing:-.02em;white-space:nowrap;color:var(--brand)}
.brand svg{width:34px;height:34px;flex:none}
.brand small{display:block;font-weight:600;font-size:11.5px;color:var(--muted);letter-spacing:.01em;line-height:1.1;margin-top:2px}
.mode{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-weight:800;font-size:11px;letter-spacing:.04em;border:1px solid var(--line2);background:var(--card);color:var(--muted);white-space:nowrap}
.mode[data-m="live"]{color:var(--ok);border-color:rgba(59,170,74,.5)}
.mode[data-m="paused"]{color:var(--bad);border-color:rgba(217,75,61,.5)}
.mode[data-m="dry"]{color:var(--warn);border-color:rgba(227,162,26,.5)}
.main{max-width:640px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(100px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));min-width:0}
.page{display:none}.page.on{display:block}
.big{font-size:40px;letter-spacing:-.02em;margin:4px 0 6px;font-weight:800}
.head{margin:6px 0 14px}.head h2{font-size:30px;letter-spacing:-.02em}.head p{color:var(--muted);font-size:14.5px;margin-top:4px;max-width:62ch}
.status{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:15px;min-height:24px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok-dot);box-shadow:0 0 0 0 rgba(59,170,74,.5);animation:pulsedot 2s infinite;flex:none}
.dot.warn{background:var(--warn-dot);animation:none}.dot.bad{background:var(--bad-dot);animation:none}.dot.off{background:var(--dim);animation:none}
@keyframes pulsedot{70%{box-shadow:0 0 0 8px rgba(59,170,74,0)}100%{box-shadow:0 0 0 0 rgba(59,170,74,0)}}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin:14px 0;min-width:0}
.card h3{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .sp{margin-left:auto;font-weight:600;font-size:12.5px;color:var(--dim)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);font-weight:700}
.next h2{font-size:22px;margin:8px 0 2px}.next p{color:var(--muted);margin:0 0 14px;font-size:15px}
.next.alert{outline:2px solid var(--bad-dot)}.next.alert .eyebrow{color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 16px;border-radius:12px;border:1px solid var(--line2);background:var(--raised);font-weight:700;font-size:14.5px;color:var(--ink);text-decoration:none}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.p{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.btn.good{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.btn.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn.cta{width:100%;justify-content:space-between;min-height:54px;border-radius:14px;background:var(--brand);color:var(--brand-ink);border:0;font-size:17px;padding:14px 20px}
.next.alert .btn.cta{background:var(--bad-dot);color:#fff}
.section{font-size:22px;font-weight:800;margin:22px 0 4px;letter-spacing:-.02em}
.section.sm{font-size:18px}
.wrow{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;padding:14px 16px;margin:10px 0;box-shadow:var(--shadow);width:100%;text-align:left;border:0;color:inherit}
.wrow .ic{width:44px;height:44px;border-radius:14px;background:var(--pill);color:var(--pill-ink);display:grid;place-items:center;flex:none}
.wrow .ic svg{width:24px;height:24px}
.wrow .t{flex:1;min-width:0}.wrow .t b{display:block;font-weight:700;font-size:17px;line-height:1.25}.wrow .t small{display:block;color:var(--muted);font-size:14px;line-height:1.35;margin-top:2px}
.wrow .chev{color:var(--dim);flex:none;width:18px;height:18px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--pill);color:var(--pill-ink);white-space:nowrap;flex:none}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.dim{background:var(--raised);color:var(--muted)}
.agentsbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--pill);color:var(--pill-ink);border-radius:18px;padding:14px 16px;font-weight:700;margin-top:14px;width:100%;border:0;text-align:left;font-size:16px}
.agentsbar .dot{display:inline-block;margin-right:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;min-width:0}
.tile b{display:block;font-weight:900;font-size:28px;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.tile span{display:block;color:var(--muted);font-size:12.5px;font-weight:600;margin-top:5px}
.tile small{display:block;color:var(--dim);font-size:11.5px;margin-top:3px}
.list{display:grid}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:700;font-size:14.5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .t small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row.click{cursor:pointer}
.row>.pill,.row>.btn,.row>small{flex:none}
.empty{padding:20px 14px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line2);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:12.5px}
.note{padding:10px 12px;border-radius:12px;font-size:13.5px;background:var(--raised)}
.note.warn{background:var(--warn-soft)}.note.bad{background:var(--bad-soft)}.note.ok{background:var(--ok-soft)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13.5px}
.kv dt{color:var(--dim);font-weight:600}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.sw .t b{display:block;font-weight:700}.sw .t small{display:block;color:var(--muted);font-size:12.5px;max-width:52ch}
.toggle{width:50px;height:30px;border-radius:999px;border:1px solid var(--line2);background:var(--sunk);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--dim);transition:transform .2s,background .2s}
.toggle[aria-checked="true"]{background:var(--brand);border-color:var(--brand)}
.toggle[aria-checked="true"]::after{transform:translateX(20px);background:#fff}
.toggle:disabled{opacity:.5;cursor:not-allowed}
.field{margin-top:10px}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;min-height:42px;padding:9px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--sunk);color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--warn-soft);font-size:13px;margin-top:8px}
.score{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;font-weight:900;font-size:14px;background:var(--raised);flex:none;font-variant-numeric:tabular-nums}
.score.hi{color:var(--ok)}.score.mid{color:var(--warn)}.score.lo{color:var(--dim)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:6px 2px;font-size:12px;font-weight:600;color:var(--muted);position:relative}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--brand);font-weight:800}
.tabs .cnt{position:absolute;top:2px;right:calc(50% - 22px);font-size:10px;font-weight:800;background:var(--bad-dot);color:#fff;border-radius:999px;padding:0 5px;min-width:16px;text-align:center}
.sheet-nav{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.45);display:none;align-items:flex-end}
.sheet-nav.on{display:flex}
.sheet-nav .in{width:100%;max-width:640px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.sheet-nav a{display:flex;align-items:center;gap:12px;padding:14px 6px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px;text-decoration:none}
.sheet-nav a svg{width:22px;height:22px;color:var(--brand)}
.sheet-nav a small{margin-left:auto;color:var(--dim);font-weight:600;font-size:12px}
.drawer-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:none}.drawer-bg.on{display:block}
.drawer{position:fixed;z-index:51;left:0;right:0;bottom:0;max-height:92%;background:var(--card);border-radius:22px 22px 0 0;box-shadow:var(--shadow);transform:translateY(100%);transition:transform .3s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;max-width:640px;margin:0 auto}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.drawer .dh h3{font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer .db{flex:1;overflow:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;align-content:start}
.x{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:var(--raised);display:grid;place-items:center}.x svg{width:16px;height:16px}
.sec{display:grid;gap:8px}.sec h4{font-size:12px;letter-spacing:.06em;color:var(--dim);font-weight:800;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.fade-in{animation:fadein .35s ease both}@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 11px;border-radius:999px;border:1px solid var(--line2);background:var(--card);font-size:12.5px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--pill);color:var(--pill-ink);border-color:transparent}
details.card summary{cursor:pointer;font-weight:700;list-style:none}
details.card summary::-webkit-details-marker{display:none}
.bar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);border-radius:999px}
.lane{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.lane:last-child{border-bottom:0}
.lane .t{flex:1;min-width:0}.lane .t b{display:block;font-size:14px}.lane .t small{display:block;color:var(--muted);font-size:12.5px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

async function write(path,data,mode){
  if(!S.db){toast("Database not available in this view");return false}
  try{const ref=S.db.doc(path);if(mode==="update")await ref.update(data);else await ref.set(data);return true}
  catch(e){console.error(e);if(e&&e.code==="invalid_argument"&&S.canWrite!==true){S.readOnly=true;queue();toast("You can view the hub but not change it")}else toast("Save failed: "+(e&&e.message?e.message:"try again"));return false}
}

    const r=await mcp.callTool("Claude Code Remote","fire_trigger",{trigger_id:t.id,text:"Grayson tapped Run now in Atlas Hub at "+fmtT(nowIso())+" Central. Do a full run now."});

/* ============================ numbers (real only) ============================ */
function today(){return dayKey()}
function month(){return today().slice(0,7)}
function liveListings(){const st=settings();const sd=S.stats[0];if(sd&&sd.listings&&typeof sd.listings==="object")return Object.keys(sd.listings).length;return st.shop&&st.shop.liveListings!=null?st.shop.liveListings:null}
function publishedToday(){const t=today();return S.products.filter(p=>p.etsy&&p.etsy.publishedAt&&dayKey(p.etsy.publishedAt)===t).length}
function feesThisMonth(){const sp=S.spend[month()];if(!sp)return null;if(typeof sp.total==="number")return sp.total;if(Array.isArray(sp.entries))return sp.entries.reduce((a,e)=>a+(Number(e.amount)||0),0);if(typeof sp.fees==="number")return sp.fees;return null}
function salesThisMonth(){const m=month();const rows=S.sales.filter(s=>String(s.date||"").slice(0,7)===m);return {n:rows.length,usd:rows.reduce((a,s)=>a+(Number(s.net!=null?s.net:s.amount)||0),0)}}
function salesAll(){return {n:S.sales.length,usd:S.sales.reduce((a,s)=>a+(Number(s.net!=null?s.net:s.amount)||0),0)}}
function pinsToday(){const t=today();return S.pins.filter(p=>(p.postedAt&&dayKey(p.postedAt)===t)||(p.status==="posted"&&p.auto&&p.auto.due&&dayKey(p.auto.due)===t)).length}
function pinsQueued(){return S.pins.filter(p=>p.status==="queued").length}
function socialToday(){const t=today();const out={instagram:null,facebook:null,youtube:null};S.social.forEach(x=>{if(x.platform==="tiktok")return;const d=x.planDate||(x.due?dayKey(x.due):dayKey(x.createdAt));if(d!==t)return;const k=x.platform;if(!(k in out))return;const st=x.status||"queued";const rank={posted:3,scheduled:2,queued:1,failed:0,qc_failed:0,rejected:0};if(out[k]==null||rank[st]>rank[out[k]])out[k]=st});return out}
function ytNewest(){const eps=Object.entries(S.ytPipe).map(([id,x])=>Object.assign({id},x));eps.sort((a,b)=>String(b.updatedAt||"").localeCompare(String(a.updatedAt||"")));return eps}
function scoreBand(n){n=Number(n);if(isNaN(n))return "lo";return n>=92?"hi":n>=85?"mid":"lo"}
function passFor(p){return settings().passScore||92}
function productScore(p){return p.score&&p.score.total!=null?Number(p.score.total):null}
function stageOf(p){return p.stage||(p.etsy&&p.etsy.listingId?"published":"queued")}
const STAGES=[["queued","Queued"],["building","Building"],["copy","Copy"],["photos","Photos"],["inspection","Inspection"],["sentback","Sent back"],["passed","Passed"],["batched","Ready to publish"],["publishing","Publishing"],["published","Live on Etsy"],["scrapped","Scrapped"]];
function working(){const st=settings();if(st.paused)return [];return AGENTS.map(a=>({a,c:S.crew[a.id]||{}})).filter(x=>x.c.state==="working")}
function mechLights(){return (S.mech&&S.mech.lights)||{}}
function medicLane(id){return S.medic&&(S.medic.board||[]).find(b=>b.lane===id)}
function needsYou(){
  const st=settings();const out=[];
  if(st.paused)out.push({t:"The agency is paused",s:"Nothing runs until you tap Resume.",go:"settings"});
  S.approvals.filter(a=>a.status==="pending").forEach(a=>out.push({t:a.title||a.summary||"An approval is waiting",s:a.detail||a.why||"",go:"approvals"}));
  if(S.medic&&Array.isArray(S.medic.needs_you))S.medic.needs_you.forEach(n=>out.push({t:n.msg||String(n),s:"The Medic tried what it can for free and could not fix this.",go:"agents"}));
  if(S.mech&&Array.isArray(S.mech.needsYou))S.mech.needsYou.forEach(x=>{if(!out.some(o=>o.t===x))out.push({t:x,s:"The Mechanic could not fix this by itself.",go:"agents"})});
  if(S.trade&&S.trade.floorLocked)out.push({t:"Paper trading hit the $20 floor and locked",s:"The bot is flat and stopped. Open Trading to read the report.",go:"trading"});
  return out;
}
function nextScheduled(){
  const p=ctParts();const mins=p.h*60+p.m;const wk=!["Sat","Sun"].includes(p.wd);
  const cands=[[1*60+54,"Night Shift builds tonight's products"],[6*60+47,"Mechanic morning report"],[7*60+13,"Bolt publishes passed products"],[7*60+51,"Scout Intel research"],[9*60+22,"Ledger pricing check"],[11*60+16,"Herald posts to Instagram, Facebook and YouTube"],[12*60+13,"Bolt publishes passed products"],[12*60+52,"Pixel video pin"],[14*60+47,"Mechanic check"],[15*60+51,"Scout Intel research"],[16*60+13,"Bolt publishes passed products"],[18*60+16,"Herald evening posts"],[22*60+47,"Mechanic night check"]];
  if(wk)cands.push([8*60+40,"Paper trading bot wakes for the open"]);
  cands.sort((a,b)=>a[0]-b[0]);
  const n=cands.find(c=>c[0]>mins)||cands[0];
  const hh=Math.floor(n[0]/60),mm=n[0]%60;
  return {title:n[1]+" at "+fmtH(hh,mm),sub:(n[0]>mins?"Next on the schedule today.":"First thing tomorrow.")+" Every crew runs by itself and leaves a line in the run log."};
}

  if(b.dataset.sale){const id=b.dataset.id,sl=S.sales.find(y=>y.id===id);if(!sl)return;if(!twoTap("sale-"+id,b,"Tap again to refund"))return;if(await write("sales/"+id,{refundAmount:Number(sl.gross)||0,refundedAt:nowIso()},"update")){logEvent("Ledger","Refund logged: "+money(sl.gross)+" · "+String(sl.listing||"").slice(0,40));toast("Refund logged.")}return}
  if(b.dataset.bill){const id=b.dataset.id,bl=S.bills.find(y=>y.id===id);if(!bl)return;const on=b.dataset.bill==="paid";const k=month();try{const ref=S.db.doc("billing/"+k);const snap=await ref.get();const cur=snap.exists?snap.data():{month:k,paid:{}};const paid=Object.assign({},cur.paid||{});if(on)paid[id]={t:nowIso(),amount:Number(bl.amount)||0};else delete paid[id];await ref.set({month:k,paid});toast(on?"Marked paid for this month.":"Undone.");if(on)logEvent("Grayson","Paid "+bl.name+" for "+k)}catch(e){toast("Couldn\'t update the bill.")}return}
  if(b.dataset.approve||b.dataset.reject){const id=b.dataset.approve||b.dataset.reject;const a=S.approvals.find(x=>x.id===id);if(!a)return;const status=b.dataset.approve?"approved":"declined";if(await updDoc("fleet/commander/approvals/"+id,{status,decidedBy:"Grayson",decidedAt:nowIso()})){toast(status==="approved"?"Approved. The next run carries it out.":"Declined.");audit((status==="approved"?"Approved":"Declined")+" proposal: "+(a.title||a.summary||id),a.mod||"fleet")}return}
});
document.addEventListener("submit",async e=>{
  const f=e.target;
  if(f.id==="saleForm"){e.preventDefault();const date=$("#slDate").value||today();const gross=Number($("#slGross").value);if(!(gross>0)){toast("Enter the gross amount");return}const lid=$("#slList").value||"";const listing=lid&&S.stats[0]&&S.stats[0].listings&&S.stats[0].listings[lid]?String(S.stats[0].listings[lid].title||lid):"Other";const now=nowIso();const id="sale-"+date+"-"+rid().slice(-5);
    const doc={date,listingId:lid||null,listing,gross:Math.round(gross*100)/100,refundAmount:0,offsite:false,verified:!!$("#slVer").checked,note:($("#slNote").value||"").trim().slice(0,120),source:"manual · Etsy Payments",by:"Grayson",createdAt:now};
    if(await setDoc("sales/"+id,doc)){toast("Logged. "+money(doc.gross)+" gross.");logEvent("Ledger","Sale logged by Grayson: "+money(doc.gross)+" · "+listing.slice(0,40))}return}
  if(f.id==="billForm"){e.preventDefault();const name=($("#bfName").value||"").trim();if(!name){toast("Name the bill");return}const id="bill-"+name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+"-"+rid().slice(-4);let link=($("#bfLink").value||"").trim();if(link&&!/^https?:/i.test(link))link="https://"+link;const a=$("#bfAmt").value,d=$("#bfDay").value;
    const doc={kind:"other",order:50,createdAt:nowIso(),name,link:link||null,autoPay:false,active:true,updatedAt:nowIso(),amount:a===""?0:Math.max(0,Number(a)),dueDay:d===""?null:Math.min(31,Math.max(1,Number(d)))};
    if(await setDoc("bills/"+id,doc)){toast("Bill saved.");logEvent("Grayson","Added a bill: "+name)}return}
  if(f.id==="lessonForm"){e.preventDefault();const text=($("#lsText").value||"").trim();const ev=($("#lsEv").value||"").trim();if(text.length<4){toast("Write the lesson first");return}const now=nowIso();const id="lesson-"+today()+"-"+rid().slice(-5);
    if(await setDoc("lessons/"+id,{text:text.slice(0,160),evidence:ev.slice(0,120)||null,source:"Grayson",by:"Grayson",confidence:"owner",at:now,createdAt:now})){toast("Lesson saved.");logEvent("Grayson","Added a lesson: "+text.slice(0,60))}return}
  if(f.id!=="capsForm")return;e.preventDefault();
  const patch={};["dailyCap","monthlyFeeCap","buildsPerRun","passScore"].forEach(k=>{const el=f.querySelector('[name="'+k+'"]');if(el&&el.value!=="")patch[k]=Number(el.value)});
  if(patch.passScore!=null&&patch.passScore<85)patch.passScore=85;
  if(await saveSettings(patch)){toast("Saved");audit("Changed caps: "+JSON.stringify(patch),"settings")}
});
$("#drawerBg").addEventListener("click",closeDrawer);$("#dClose").addEventListener("click",closeDrawer);
$("#sheetNav").addEventListener("click",e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove("on")});
window.addEventListener("hashchange",()=>{const t=location.hash.replace("#","");if(PAGES.some(p=>p.id===t))go(t)});
(function start(){
  const h=location.hash.replace("#","");const saved=ls.get("atlas.page");
  S.page=PAGES.some(p=>p.id===h)?h:(PAGES.some(p=>p.id===saved)?saved:"today");
  if(window.claude&&window.claude.hot&&window.claude.hot.snapshot){try{window.claude.hot.snapshot(()=>({page:S.page}))}catch(e){}}
  const data=(window.claude&&window.claude.hot&&window.claude.hot.data)||{};if(data.page&&PAGES.some(p=>p.id===data.page))S.page=data.page;
  boot();
})();
})();
