<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Starship · Etsy connected</title>
<style>body{font:17px -apple-system,system-ui,sans-serif;background:#f6f1e9;color:#2a2622;margin:0;padding:24px;text-align:center}
.card{background:#fffdf9;border:1px solid #e7ded2;border-radius:18px;padding:22px;max-width:460px;margin:30px auto}
code{display:block;word-break:break-all;background:#f1e9dc;border-radius:10px;padding:14px;font-size:14px;margin:14px 0}
button{background:#1f7a6d;color:#fff;border:0;border-radius:12px;padding:14px 22px;font-size:17px;font-weight:700}</style></head>
<body><div class="card"><h2 id="h">Almost done</h2><p id="p">Copy this and send it to Claude:</p><code id="c"></code>
<button id="b">Copy</button></div>
<script>
const q=new URLSearchParams(location.search);const code=q.get("code"),st=q.get("state"),err=q.get("error");
const c=document.getElementById("c");
if(err){document.getElementById("h").textContent="Etsy said no";document.getElementById("p").textContent="Send Claude this:";c.textContent=err+" "+(q.get("error_description")||"");}
else if(code){c.textContent="etsy code: "+code+" state: "+st;}
else{document.getElementById("h").textContent="Nothing here";document.getElementById("p").textContent="Open the Etsy link Claude sent you first.";c.style.display="none";document.getElementById("b").style.display="none";}
document.getElementById("b").onclick=async()=>{try{await navigator.clipboard.writeText(c.textContent);document.getElementById("b").textContent="Copied ✓"}catch(e){}};
</script></body></html>
